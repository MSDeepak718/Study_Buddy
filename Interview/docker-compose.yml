version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: interview_postgres
    environment:
      POSTGRES_DB: interview_platform
      POSTGRES_USER: interview_user
      POSTGRES_PASSWORD: interview_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview_user -d interview_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
